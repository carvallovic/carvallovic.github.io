<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Construcciones Montero</title>
    
    <link rel="stylesheet" href="CSS/estilos_vc.css">
</head>
<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="#orders" class="menu-item">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item activo">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item">
                        <span>👤</span> Personal
                    </a>
                    <a href="clientes.html" class="menu-item">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="contenido-main">
            
            <h1 class="titulo-pagina">EDITAR PRODUCTO / SERVICIO</h1>

            <div class="card-registro">
                <div class="banner-registro">Edición de datos de Producto / Servicio</div>

                <!-- Mensaje de confirmación -->
                <div id="mensajeExito" class="alerta-exito">
                    ✓ ¡Los cambios han sido guardados con éxito!
                </div>

                <form id="formEditarProducto">
                    <div class="form-grupo">
                        <label for="nombre">NOMBRE DEL SERVICIO O PRODUCTO</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label for="precioDesde">PRECIO DESDE ($)</label>
                            <input type="text" id="precioDesde" name="precioDesde" required>
                        </div>

                        <div class="form-grupo">
                            <label for="precioHasta">PRECIO HASTA ($)</label>
                            <input type="text" id="precioHasta" name="precioHasta" required>
                        </div>
                    </div>

                    <div class="grid-perfil">
                        <div class="form-grupo">
                            <label for="estado">ESTADO</label>
                            <select id="estado" name="estado" required>
                                <option value="">-- Seleccione el Estado --</option>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>

                        <div class="form-grupo">
                            <label for="fechaAlta">FECHA DE ALTA</label>
                            <input type="date" id="fechaAlta" name="fechaAlta" required>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="fechaModificacion">FECHA DE ÚLTIMA MODIFICACIÓN</label>
                        <input type="date" id="fechaModificacion" name="fechaModificacion">
                    </div>

                    <div class="form-grupo">
                        <label for="descripcion">DESCRIPCIÓN (opcional)</label>
                        <textarea id="descripcion" name="descripcion" rows="4" style="width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 8px; font-family: inherit;"></textarea>
                    </div>

                    <div class="container-btn">
                        <button type="button" class="btn-cancelar" onclick="window.location.href='productos.html'">CANCELAR</button>
                        <button type="submit" class="btn-registrar">GUARDAR CAMBIOS</button>
                    </div>
                </form>
            </div>

        </main>

    </div>

    <!-- Enlace al JS principal -->
    <script src="JS/JSADMIN.js"></script>

</body>
</html>
