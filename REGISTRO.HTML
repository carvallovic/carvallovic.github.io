<section>

    <h2>Registro de usuario</h2>

    <p>
        Crea una cuenta para acceder a las funcionalidades de
        Construcciones Montero.
    </p>

    <form id="formRegistro">

        <label for="nombreRegistro">Nombre:</label>

        <input
            type="text"
            id="nombreRegistro"
            maxlength="100"
            autocomplete="name">

        <p id="errorNombreRegistro"></p>


        <label for="correoRegistro">Correo:</label>

        <input
            type="text"
            id="correoRegistro"
            maxlength="100"
            autocomplete="email">

        <p id="errorCorreoRegistro"></p>


        <label for="passwordRegistro">Contraseña:</label>

        <input
            type="password"
            id="passwordRegistro"
            maxlength="50"
            autocomplete="new-password">

        <p id="errorPasswordRegistro"></p>


        <label for="confirmarPassword">Confirmar contraseña:</label>

        <input
            type="password"
            id="confirmarPassword"
            maxlength="50"
            autocomplete="new-password">

        <p id="errorConfirmarPassword"></p>


        <button type="submit">
            Registrarse
        </button>

        <p id="mensajeRegistro"></p>

    </form>

</section>
