<main>

<section>

    <h2>Inicio de sesión</h2>

    <p>
        Ingresa tus datos para acceder a tu cuenta.
    </p>

    <form id="formLogin">

        <label for="correoLogin">Correo:</label>

        <input
            type="text"
            id="correoLogin"
            maxlength="100"
            autocomplete="email">

        <p id="errorCorreoLogin"></p>

        <label for="passwordLogin">Contraseña:</label>

        <input
            type="password"
            id="passwordLogin"
            maxlength="50"
            autocomplete="current-password">

        <p id="errorPasswordLogin"></p>

        <button type="submit">
            Iniciar sesión
        </button>

        <p id="mensajeLogin"></p>

    </form>

</section>
