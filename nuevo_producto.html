<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Construcciones Montero</title>
    <link rel="stylesheet" href="CSS/estilos_vc.css">
</head>

<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item" data-menu="dashboard">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="ordenes.html" class="menu-item" data-menu="ordenes">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item activo" data-menu="productos">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item" data-menu="reportes">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item" data-menu="personal">
                        <span>👤</span> Personal
                    </a>
                    <a href="clientes.html" class="menu-item" data-menu="clientes">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="contenido-main">

            <h2 class="titulo-pagina">REGISTRAR NUEVO PRODUCTO / SERVICIO</h2>

            <div class="card-registro">
                <div class="banner-registro">Ingreso de datos de Producto / Servicio</div>

                <!-- Mensaje de éxito -->
                <div id="mensajeExito" class="alerta-exito">
                    ✔ Producto o servicio creado correctamente.
                </div>

                <form id="formEditarProducto">
                    <div class="form-grupo">
                        <label for="nombre">NOMBRE DEL SERVICIO / PRODUCTO *</label>
                        <input type="text" id="nombre" required placeholder="Ej. Pintura y Terminaciones">
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label for="precioDesde">PRECIO DESDE *</label>
                            <input type="text" id="precioDesde" required placeholder="$100.000">
                        </div>
                        <div class="form-grupo">
                            <label for="precioHasta">PRECIO HASTA *</label>
                            <input type="text" id="precioHasta" required placeholder="$500.000">
                        </div>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label for="estado">ESTADO *</label>
                            <select id="estado" required>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                        <div class="form-grupo">
                            <label for="fechaAlta">FECHA ALTA *</label>
                            <input type="date" id="fechaAlta" required>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="fechaModificacion">FECHA ÚLTIMA MODIFICACIÓN *</label>
                        <input type="date" id="fechaModificacion" required>
                    </div>

                    <div class="container-btn">
                        <a href="productos.html" class="btn-cancelar">CANCELAR</a>
                        <button type="submit" class="btn-registrar">GUARDAR PRODUCTO</button>
                    </div>
                </form>
            </div>

        </main>

    </div>

    <script src="JS/JSADMIN.js"></script>
</body>

</html>
