<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Cliente - Construcciones Montero</title>
    <link rel="stylesheet" href="CSS/estilos_vc.css">
</head>

<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item" data-menu="dashboard">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="ordenes.html" class="menu-item" data-menu="ordenes">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item" data-menu="productos">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item" data-menu="reportes">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item" data-menu="personal">
                        <span>👤</span> Personal
                    </a>
                    <a href="clientes.html" class="menu-item activo" data-menu="clientes">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido-main">
            <h2 class="titulo-pagina">REGISTRAR NUEVO CLIENTE</h2>

            <div class="card-registro">
                <div class="banner-registro">Ingreso de datos de Cliente</div>

                <!-- Alerta de éxito -->
                <div class="alerta-exito" id="mensajeExito" style="display: none;">
                    ¡Cliente registrado con éxito!
                </div>

                <form id="formNuevoCliente">
                    <div class="form-grupo">
                        <label>NOMBRE COMPLETO / RAZÓN SOCIAL</label>
                        <input type="text" id="nombre" placeholder="Ej: María José Fernández" required>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>RUT / IDENTIFICACIÓN</label>
                            <input type="text" id="rut" placeholder="12.345.678-9" required>
                        </div>
                        <div class="form-grupo">
                            <label>TIPO DE CLIENTE</label>
                            <input type="text" id="cargo" placeholder="Ej: Particular, Cliente Corporativo" required>
                        </div>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>FECHA DE NACIMIENTO</label>
                            <input type="date" id="fechaNacimiento">
                        </div>
                        <div class="form-grupo">
                            <label>PERFIL / ROL</label>
                            <select id="perfil" name="perfil">
                                <option value="user" selected>Usuario</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>CORREO ELECTRÓNICO</label>
                            <input type="email" id="correo" placeholder="cliente@duoc.cl" required>
                        </div>
                        <div class="form-grupo">
                            <label>TELÉFONO DE CONTACTO</label>
                            <input type="text" id="telefono" placeholder="+56 9 1234 5678">
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label>DIRECCIÓN</label>
                        <input type="text" id="direccion" placeholder="Calle, número">
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>REGIÓN</label>
                            <select name="region">
                                <option value="">-- Seleccione Región --</option>
                                <option value="rm">Región Metropolitana</option>
                            </select>
                        </div>
                        <div class="form-grupo">
                            <label>COMUNA</label>
                            <select name="comuna">
                                <option value="">-- Seleccione Comuna --</option>
                                <option value="santiago">Santiago</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>CONTRASEÑA</label>
                            <input type="password" id="contrasena" required>
                        </div>
                        <div class="form-grupo">
                            <label>CONFIRMAR CONTRASEÑA</label>
                            <input type="password" id="confirmarContrasena" required>
                        </div>
                    </div>

                    <div class="container-btn">
                        <button type="button" class="btn-cancelar" onclick="location.href='clientes.html'">CANCELAR</button>
                        <button type="submit" class="btn-registrar">GUARDAR CLIENTE</button>
                    </div>
                </form>
            </div>
        </main>

    </div>

    <script src="JS/JSADMIN.js"></script>
</body>

</html>
