<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente - Construcciones Montero</title>
    <link rel="stylesheet" href="CSS/estilos_vc.css">
</head>

<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item" data-menu="dashboard">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="ordenes.html" class="menu-item" data-menu="ordenes">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item" data-menu="productos">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item" data-menu="reportes">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item" data-menu="personal">
                        <span>👤</span> Personal
                    </a>
                    <a href="clientes.html" class="menu-item activo" data-menu="clientes">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <main class="contenido-main">
            <h2 class="titulo-pagina">EDITAR CLIENTE</h2>

            <div class="card-registro">
                <div class="banner-registro">Edición de datos de Cliente</div>

                <!-- Alerta de actualización -->
                <div class="alerta-exito" id="alertaExito">
                    ¡Datos del cliente actualizados correctamente!
                </div>

                <form id="formEditarCliente" action="#" method="POST">
                    <input type="hidden" name="id_cliente" id="id_cliente" value="001">

                    <div class="form-grupo">
                        <label>NOMBRE COMPLETO / RAZÓN SOCIAL</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>TIPO / OCUPACIÓN</label>
                            <input type="text" id="tipo">
                        </div>
                        <div class="form-grupo">
                            <label>PERFIL / ROL</label>
                            <select name="perfil" id="perfil">
                                <option value="Usuario">Usuario</option>
                                <option value="Admin">Administrador</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label>CORREO ELECTRÓNICO</label>
                        <input type="email" id="correo" required>
                    </div>

                    <div class="form-grupo">
                        <label>TELÉFONO DE CONTACTO</label>
                        <input type="text" id="telefono" value="+56 9 1234 5678">
                    </div>

                    <div class="form-grupo">
                        <label>DIRECCIÓN</label>
                        <input type="text" id="direccion" value="Av. Providencia 1234, Depto 502">
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>REGIÓN</label>
                            <select name="region" id="region">
                                <option value="">-- Seleccione Región --</option>
                                <option value="rm" selected>Región Metropolitana</option>
                            </select>
                        </div>
                        <div class="form-grupo">
                            <label>COMUNA</label>
                            <select name="comuna" id="comuna">
                                <option value="">-- Seleccione Comuna --</option>
                                <option value="providencia" selected>Providencia</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label>FECHA DE NACIMIENTO</label>
                        <input type="date" id="fechaNacimiento">
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>CONTRASEÑA (Dejar en blanco para no cambiar)</label>
                            <input type="password" id="contrasena" placeholder="••••••••">
                        </div>
                        <div class="form-grupo">
                            <label>CONFIRMAR CONTRASEÑA</label>
                            <input type="password" id="confirmarContrasena" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="container-btn">
                        <button type="button" class="btn-cancelar" onclick="history.back()">CANCELAR</button>
                        <button type="submit" class="btn-registrar">GUARDAR CAMBIOS</button>
                    </div>
                </form>
            </div>
        </main>

    </div>

    <script src="JS/JSADMIN.js"></script>
</body>

</html>
