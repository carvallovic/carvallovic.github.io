<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Construcciones Montero</title>
    
    <!-- Hoja de estilo original -->
    <link rel="stylesheet" href="CSS/estilos_vc.css">

   
</head>
<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <!-- Brand / Logo -->
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <!-- Menú Superior -->
                <nav class="menu-grupo">
                    <a href="#dashboard" class="menu-item activo">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="#orders" class="menu-item">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item">
                        <span>👤</span> Personal
                    </a>
                    <a href="#customers" class="menu-item">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <!-- Menú Configuración -->
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <!-- Perfil Footer -->
                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL (PANEL DERECHO) -->
        <main class="contenido-main">
            
            <!-- Recuadro Superior -->
            <section class="panel-top">
                <div class="panel-top-header">
                    <h2>¡Hola Administrador!</h2>
                    <span class="icono-campana" title="Notificaciones">🔔</span>
                </div>
            </section>

            <!-- Recuadro Inferior -->
            <section class="panel-bottom">
                <!-- Espacio libre para tablas, formularios o contenido futuro -->
            </section>

        </main>

    </div>

</body>
</html>
