<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Empleado - Construcciones Montero</title>
    <link rel="stylesheet" href="CSS/estilos_vc.css">
</head>

<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item" data-menu="dashboard">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="ordenes.html" class="menu-item" data-menu="ordenes">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item" data-menu="productos">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item" data-menu="reportes">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item activo" data-menu="personal">
                        <span>👤</span> Personal
                    </a>
                    <a href="clientes.html" class="menu-item" data-menu="clientes">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido-main">
            <h2 class="titulo-pagina">EDITAR EMPLEADO</h2>

            <div class="card-registro">
                <div class="banner-registro">Edición de datos de Empleado</div>

                <!-- Alerta opcional de actualización -->
                <div class="alerta-exito" id="alertaExito">
                    ¡Datos del empleado actualizados correctamente!
                </div>

                <form action="#" method="POST">
                    <!-- ID oculto del registro -->
                    <input type="hidden" name="id_empleado" value="001">

                    <div class="form-grupo">
                        <label>NOMBRE COMPLETO</label>
                        <input type="text" value="Gonzalo Morales Ruiz" required>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>RUT / DNI</label>
                            <input type="text" value="12.345.678-9" required>
                        </div>
                        <div class="form-grupo">
                            <label>CARGO / PUESTO</label>
                            <input type="text" value="Administrador">
                        </div>
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>PERFIL / ROL</label>
                            <select name="perfil">
                                <option value="Usuario">Usuario</option>
                                <option value="Usuario">Supervisor</option>
                                <option value="Usuario">Vendedor</option>
                                <option value="Admin" selected>Administrador</option>
                            </select>
                        </div>
                        <div class="form-grupo">
                            <label>ESTADO</label>
                            <select name="estado">
                                <option value="activo" selected>Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label>CORREO ELECTRÓNICO</label>
                        <input type="email" value="gonzalo@correo.com" required>
                    </div>

                    <div class="form-grupo">
                        <label>TELÉFONO DE CONTACTO</label>
                        <input type="text" value="+56 9 1234 5678">
                    </div>

                    <div class="form-grupo">
                        <label>DIRECCIÓN</label>
                        <input type="text" value="Av. Providencia 1234">
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <label>CONTRASEÑA (Dejar en blanco para mantener la actual)</label>
                            <input type="password" placeholder="••••••••">
                        </div>
                        <div class="form-grupo">
                            <label>CONFIRMAR CONTRASEÑA</label>
                            <input type="password" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="container-btn">
                        <button type="button" class="btn-cancelar" onclick="history.back()">CANCELAR</button>
                        <button type="submit" class="btn-registrar">GUARDAR CAMBIOS</button>
                    </div>
                </form>
            </div>
        </main>

    </div>

    <script src="JS/JSADMIN.js"></script>
</body>

</html>
