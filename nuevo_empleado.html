<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Construcciones Montero</title>
    
    <link rel="stylesheet" href="CSS/estilos_vc.css">

</head>
<body>

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="IMG/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="#orders" class="menu-item">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item activo">
                        <span>👤</span> Personal
                    </a>
                    <a href="#customers" class="menu-item">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="contenido-main">
            
            <h1 class="titulo-pagina">NUEVO EMPLEADO</h1>

            <div class="card-registro">
                <div class="banner-registro">Registro de empleado</div>

                <!-- Mensaje de confirmación de registro -->
                <div id="mensajeExito" class="alerta-exito">
                    ✓ ¡El empleado ha sido registrado con éxito!
                </div>

                <form id="formNuevoUsuario">
                    <div class="form-grupo">
                        <label for="nombre">NOMBRE COMPLETO</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-grupo">
                        <label for="correo">CORREO</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <div class="form-grupo">
                        <label for="direccion">DIRECCIÓN</label>
                        <input type="text" id="direccion" name="direccion">
                    </div>

                    <div class="form-grupo">
                        <label for="cargo">CARGO</label>
                        <input type="text" id="cargo" name="cargo" required>
                    </div>

                    <div class="grid-perfil">
                        <div class="form-grupo">
                            <label for="perfil">PERFIL</label>
                            <select id="perfil" name="perfil" required>
                                <option value="">-- Seleccione el Perfil --</option>
                                <option value="sup">Supervisor</option>
                                <option value="op">Operativo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="contrasena">CONTRASEÑA</label>
                        <input type="password" id="contrasena" name="contrasena" required>
                    </div>

                    <div class="form-grupo">
                        <label for="confirmarContrasena">CONFIRMAR CONTRASEÑA</label>
                        <input type="password" id="confirmarContrasena" name="confirmarContrasena" required>
                    </div>

                    <div class="form-grupo">
                        <label for="telefono">TELÉFONO (opcional)</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div class="grid-selects">
                        <div class="form-grupo">
                            <select id="region" name="region">
                                <option value="">-- Seleccione la Región --</option>
                                <option value="rm">Región Metropolitana de Santiago</option>
                                <option value="araucania">Región de la Araucanía</option>
                                <option value="nuble">Región de Ñuble</option>
                            </select>
                        </div>

                        <div class="form-grupo">
                            <select id="comuna" name="comuna">
                                <option value="">-- Seleccione la comuna --</option>
                                <option value="linares">Linares</option>
                                <option value="longavi">Longaví</option>
                                <option value="concepcion">Concepción</option>
                            </select>
                        </div>
                    </div>

                    <div class="container-btn">
                        <button type="submit" class="btn-registrar">REGISTRAR</button>
                    </div>
                </form>
            </div>

        </main>

    </div>

    

    <!-- Enlace al JS en mis carpertas -->
    <script src="JS/JSADMIN.js"></script>

</body>
</html>
