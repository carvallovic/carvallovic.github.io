<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Construcciones Montero</title>
    <link rel="stylesheet" href="CSS/estilos_vc.css">
</head>

<body onload="renderizarTabla(1)">

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="img/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item" data-menu="dashboard">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="ordenes.html" class="menu-item" data-menu="ordenes">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item activo" data-menu="productos">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item" data-menu="reportes">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item" data-menu="personal">
                        <span>👤</span> Personal
                    </a>
                    <a href="clientes.html" class="menu-item" data-menu="clientes">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="contenido-main">

            <div class="header-usuarios">
                <div class="header-left">
                    <h2>Productos y Servicios</h2>
                </div>
                <div class="header-right">
                    <button class="btn-editar" id="btnEditar" style="display: none;" onclick="editarProducto()">Editar Producto</button>
                    <a href="nuevo_producto.html" class="btn-nuevo">+ Nuevo Producto</a>
                    <span class="icono-campana" title="Notificaciones">🔔</span>
                </div>
            </div>

            <div class="tabla-container">
                <table class="tabla-usuarios">
                    <thead>
                        <tr>
                            <th>Nombre <span>⇅</span></th>
                            <th>Precio Desde <span>⇅</span></th>
                            <th>Precio Hasta <span>⇅</span></th>
                            <th>Estado <span>⇅</span></th>
                            <th>Fecha Alta <span>⇅</span></th>
                            <th>Fecha Modificación <span>⇅</span></th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo">
                        <!-- Se carga dinámicamente desde JSADMIN.js -->
                    </tbody>
                </table>
            </div>

            <div class="paginacion-container">
                <div class="paginacion">
                    <button class="btn-pag" onclick="cambiarPagina('prev')">&lt;</button>
                    <button class="btn-num active" onclick="cambiarPagina(1)">1</button>
                    <button class="btn-pag" onclick="cambiarPagina('next')">&gt;</button>
                </div>
            </div>

        </main>

    </div>

    <script src="JS/JSADMIN.js"></script>
</body>

</html>
