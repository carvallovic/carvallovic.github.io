<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal - Construcciones Montero</title>
    
    <link rel="stylesheet" href="CSS/estilos_vc.css">

</head>
<body onload="renderizarTabla(1)">

    <div class="layout-admin">

        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <img src="IMG/LOGO.png" alt="Logo" id="logo-icon" style="width: 70px; height: 70px; object-fit: contain;">
                    <span>Construcciones Montero</span>
                </div>

                <nav class="menu-grupo">
                    <a href="admin_home.html" class="menu-item">
                        <span>⊞</span> Dashboard
                    </a>
                    <a href="#orders" class="menu-item">
                        <span>📋</span> Ordenes
                    </a>
                    <a href="productos.html" class="menu-item activo">
                        <span>📦</span> Productos
                    </a>
                    <a href="#reports" class="menu-item">
                        <span>📄</span> Reportes
                    </a>
                    <a href="empleados.html" class="menu-item">
                        <span>👤</span> Personal
                    </a>
                    <a href="#customers" class="menu-item">
                        <span>👥</span> Clientes
                    </a>
                </nav>
            </div>

            <div>
                <nav class="menu-grupo">
                    <a href="#settings" class="menu-item">
                        <span>⚙</span> Ajustes
                    </a>
                    <a href="#search" class="menu-item">
                        <span>🔍</span> Búsqueda
                    </a>
                    <a href="#help" class="menu-item">
                        <span>❓</span> Ayuda
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="#profile" class="menu-item">
                        <span>👤</span> Perfil
                    </a>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="contenido-main">
            
            <div class="header-usuarios">
                <div class="header-left">
                    <h2>Productos</h2>
                    <button class="btn-nuevo" onclick="window.location.href='NUEVO_PRODUCTO.HTML'">NUEVO PRODUCTO</button>
                    <button id="btnEditar" class="btn-editar" onclick="editarProducto()">EDITAR PRODUCTO</button>
                </div>
                <span class="icono-campana" title="Notificaciones">🔔</span>
            </div>

            <div class="filtro-sub">
                Todo el Personal <span>▼</span>
            </div>

            <div class="tabla-container">
                <table class="tabla-usuarios">
                    <thead>
                        <tr>
                            <th>Nombre <span>⇅</span></th>
                            <th>Cargo <span>⇅</span></th>
                            <th>Perfil <span>⇅</span></th>
                            <th>Estado <span>⇅</span></th>
                            <th>Fecha Ingreso <span>⇅</span></th>
                            <th>Fecha Egreso <span>⇅</span></th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo">
                        <!-- Generado dinámicamente -->
                    </tbody>
                </table>
            </div>

            <div class="paginacion-bar">
                <button onclick="cambiarPagina('prev')">&lt;</button>
                <button class="btn-num active" onclick="cambiarPagina(1)">1</button>
                <button class="btn-num" onclick="cambiarPagina(2)">2</button>
                <button class="btn-num" onclick="cambiarPagina(3)">3</button>
                <button onclick="cambiarPagina('next')">&gt;</button>
            </div>

        </main>

    </div>

    <!-- Enlace al JS -->
    <script src="JS/JSADMIN.js"></script>

</body>
</html>
